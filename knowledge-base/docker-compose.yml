version: "3.9"

# ── Local development stack ───────────────────────────────────────────────────
# Run everything with:  docker-compose up --build
# Stop everything with: docker-compose down
# Wipe the database:    docker-compose down -v

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: knowledge_base
      POSTGRES_USER: kb_admin
      POSTGRES_PASSWORD: kb_local_password
    ports:
      - "5432:5432"          # expose so you can connect with a DB client (TablePlus, DBeaver, etc.)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kb_admin -d knowledge_base"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis (sessions + cache) ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # ── FastAPI backend ─────────────────────────────────────────────────────────
  api:
    build:
      context: .
      target: backend          # uses the backend stage in the Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://kb_admin:kb_local_password@db:5432/knowledge_base
      DEBUG: "true"
      CORS_ORIGINS: "http://localhost:3000"
    ports:
      - "8000:8000"
    volumes:
      - .:/app                 # hot-reload: changes on disk reflect immediately
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload

  # ── React dev server ────────────────────────────────────────────────────────
  web:
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules      # don't overwrite container's node_modules with host's
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_BASE: http://localhost:8000
      CHOKIDAR_USEPOLLING: "true"   # needed for file-watching inside Docker on macOS
    command: npm start
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
